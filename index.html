<!doctype html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#17212b;background:white;font-size:14px}.topbar{min-height:76px;display:flex;align-items:flex-start;border-bottom:1px solid #ddd;padding:16px 32px 0;gap:18px;flex-wrap:wrap}.brand{font-weight:900;font-size:28px;color:#000;letter-spacing:-1px}.loop{font-weight:600;margin-left:2px}.user{font-size:12px;margin-top:14px;white-space:nowrap}.nav{display:flex;flex-wrap:wrap;gap:0 8px;align-items:flex-start}.nav button{background:white;border:0;border-right:1px solid #ddd;padding:4px 14px 9px;font-size:14px}.nav .active{border-bottom:4px solid #B2FCE4;font-weight:700}.challenge-banner{background:#F2F2F2;border-bottom:2px solid #B2FCE4;padding:16px 32px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:20px}.challenge-banner h2{margin:0 0 4px;font-size:16px}.challenge-banner ol{margin:4px 0 0;padding-left:20px}.challenge-banner .answer{background:#B2FCE4;padding:10px 16px;border-radius:16px;font-size:13px;margin-top:8px}.challenge-left{flex:1;min-width:300px}.challenge-right{flex:0 0 auto}.crumb{background:#e9e9e9;padding:11px 32px}.crumb a{text-decoration:underline;color:#000;cursor:pointer}.tabbar{background:#e9e9e9;padding:0 32px 8px;display:flex;flex-wrap:wrap}.tab{min-width:120px;padding:10px 16px;background:#f8f8f8;border:1px solid #d4d4d4;color:#555;font-size:13px}.tab.active{background:white;color:#000;font-weight:800}main{overflow-x:auto;min-width:0}.searchHero{padding:35px 32px 10px}h1{font-size:24px;margin:0 0 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h2{font-size:16px;font-weight:500;margin:22px 0 12px}.pill,.mintBtn{border-radius:999px;border:1px solid #d9d9d9;background:#f2f2f2;padding:8px 20px}.pill.small{font-size:14px;padding:6px 18px;font-weight:400}.mintBtn{background:#B2FCE4;border:0;font-size:12px}.filters,.orderFilters{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0}input,select,.field{height:48px;border:1px solid #bdc7d1;background:white;border-radius:4px;padding:0 14px;font-size:14px;min-width:160px}.filters input{min-width:200px}.actions{text-align:center}.iconBtn,.circle{height:54px;min-width:120px;border-radius:24px;border:1px solid #d6d6d6;background:white;margin:0 8px;cursor:pointer}.circle{min-width:54px}table{width:100%;border-collapse:collapse}th{background:#dedede;text-align:left;text-transform:uppercase;font-weight:800;padding:12px 14px}td{border-bottom:1px solid #e2e2e2;padding:10px 14px;color:#5a6872}tbody tr:hover{background:#c9eaff;cursor:pointer}a{text-decoration:underline;color:#314f5f;cursor:pointer}.hint{margin:24px 32px;background:#B2FCE4;display:inline-block;padding:10px 18px;border-radius:999px}.detail{padding:28px 32px}.detail.narrow{max-width:720px}.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px}.kv{display:grid;grid-template-columns:170px 1fr;gap:12px;margin:10px 0;line-height:1.25}.kv b{font-weight:500}.kv.large{grid-template-columns:280px 1fr;font-size:16px;margin:22px 0}.link{font-weight:800;text-decoration:underline}.green{color:green;font-weight:800}.amountDue{margin-top:20px;border:1px solid #ddd;text-align:center}.amountDue div{background:#000;color:white;padding:16px}.amountDue strong{display:block;font-size:30px;line-height:1.1;padding:28px}.miniTabs{background:#e9e9e9;padding:8px 32px}.miniTabs button{background:white;border:1px solid #ddd;padding:10px 42px;font-weight:700}.summaryGrid{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;margin-top:30px}.panel{border-top:1px solid #ddd;border-bottom:1px solid #eee;padding:0 20px 10px}.product{max-width:480px;width:100%;background:#f7f7f7;padding:18px 26px;display:flex;justify-content:space-between;align-items:center}.product small{display:block;color:#888;margin-top:10px}.icon{font-size:22px}.empty{padding:30px 32px;color:#565D56}@media(max-width:900px){.cols,.summaryGrid{grid-template-columns:1fr}.topbar{height:auto}.filters input{min-width:180px}}
</style>
</head>
<body>
<div id="app"></div>
<script>

const customers=[

{id:"12909931",accountId:"3476014",uuid:"69868d4f-12a7-4dcb-b8dc-027bb84813e4",token:"C_chen03kb",firstName:"Leo",lastName:"Chen",email:"leo.chen@example.com",mobile:"0466 240 410",dob:"1990-12-04",address:"15 Lonsdale St, Melbourne VIC 3000",status:"Registered",payIn4Limit:1000,availableToSpend:860,amountOutstanding:0,paymentsPaidLate:0,collections:"False",accountType:"Afterpay",pmLimit:4000,pmCreated:"25 Feb 2026",pmStatus:"CLOSED",orders:["125459119"]}
];
const orderSeed={
"125459135":{product:"iPhone 16 Pro 256GB",amount:2499,term:12,customerId:"12905211",status:"Approved",settlement:"Captured",source:"APPLE_RETAIL_ONLINE",date:"2026/02/26 8:28AM",receipt:"2166988640",paymentStatus:"OWED"},
"125459406":{product:"MacBook Air",amount:3999,term:24,customerId:"12905211",status:"Approved",settlement:"Captured",source:"APPLE_RETAIL_TELESALES",date:"2026/02/26 8:16AM",receipt:"e36f02a0-ceeb-3a47-804a-5ce5751514cb",paymentStatus:"OWED"},
"125459414":{product:"Apple Watch Ultra",amount:1999,term:6,customerId:"12905211",status:"Approved",settlement:"Captured",source:"APPLE_RETAIL_TELESALES",date:"2026/02/26 8:25AM",receipt:"2166988711",paymentStatus:"OWED"},
"125459410":{product:"iPhone 16 Pro 256GB",amount:1999,term:6,customerId:"12904246",status:"Approved",settlement:"Captured",source:"APPLE_RETAIL_TELESALES",date:"2026/02/26 8:20AM",receipt:"2166988624",paymentStatus:"PAID"},
"125459411":{product:"AirPods Pro",amount:399,term:6,customerId:"12904246",status:"Approved",settlement:"Captured",source:"APPLE_RETAIL_ONLINE",date:"2026/02/26 8:21AM",receipt:"2166988625",paymentStatus:"OWED"},
"125459404":{product:"Apple Watch Ultra",amount:1999,term:6,customerId:"12906044",status:"Approved",settlement:"Expired",source:"APPLE_RETAIL_TELESALES",date:"2026/02/26 8:15AM",receipt:"2166988616",paymentStatus:"REFUNDED"},
"125459415":{product:"iPad Pro 13-inch",amount:2499,term:12,customerId:"12907189",status:"Approved",settlement:"Captured",source:"APPLE_RETAIL_ONLINE",date:"2026/02/26 8:29AM",receipt:"2166988720",paymentStatus:"LATE"},
"125459133":{product:"MacBook Pro",amount:4999,term:24,customerId:"12907189",status:"Approved",settlement:"Captured",source:"APPLE_RETAIL_ONLINE",date:"2026/02/26 8:26AM",receipt:"2166988613",paymentStatus:"OWED"},
"125459130":{product:"MacBook Pro",amount:6999,term:24,customerId:"12908810",status:"Approved",settlement:"Captured",source:"APPLE_RETAIL_ONLINE",date:"2026/02/26 8:19AM",receipt:"2166988609",paymentStatus:"LATE"},
"125459132":{product:"iPhone 16 Pro Max",amount:2999,term:12,customerId:"12908810",status:"Approved",settlement:"Captured",source:"APPLE_RETAIL_ONLINE",date:"2026/02/26 8:25AM",receipt:"2166988612",paymentStatus:"LATE"},
"125459207":{product:"iPad Pro 13-inch",amount:2500,term:12,customerId:"12908810",status:"Approved",settlement:"Captured",source:"APPLE_RETAIL_ONLINE",date:"2026/02/26 8:24AM",receipt:"2166989207",paymentStatus:"OWED"},
"125459119":{product:"iPhone 16",amount:1249,term:6,customerId:"12909931",status:"Approved",settlement:"Captured",source:"APPLE_RETAIL_ONLINE",date:"2026/02/26 8:18AM",receipt:"2166989119",paymentStatus:"PAID"}
};
function makeSchedule(orderNo,o){const monthly=Math.floor((o.amount/o.term)*100)/100;let rows=[];for(let i=0;i<o.term;i++){let d=new Date(2026,2+i,26);let base=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;let amt=i===o.term-1?Math.round((o.amount-monthly*(o.term-1))*100)/100:monthly;let status="AWAITING PAYMENT",dueIn=i<3?"OVERDUE":`${(i-2)*30} days`;if(o.paymentStatus==="PAID"){status="PAID";dueIn="PAID"}if(o.paymentStatus==="REFUNDED"){status="REFUNDED";dueIn="REFUNDED";amt=0}if(o.paymentStatus==="LATE"&&i<3){status="LATE";dueIn="OVERDUE"}rows.push({id:`${15100000+Number(orderNo.slice(-4))+i}`,orderNo,date:base,dueIn,amount:amt,status})}return rows}
const orders=Object.fromEntries(Object.entries(orderSeed).map(([no,o])=>[no,{orderNo:no,...o,schedule:makeSchedule(no,o)}]));
let state={type:"search", results:[]};
function setState(s){state={...state,...s}; render();}
const el=id=>document.getElementById(id);
function header(active){const nav=["Home","Orders","Audit","Merchants","Prospects","Approvals","Admin Portal Users","All Merchant Users","Chargebacks","Disputes","Finance","Bulk","Scheduler","Promotion","Donations","Agency","Partners","Settings","Logout"];return `<div class="topbar"><div class="brand">afterpay<span class="loop">&#8596;</span></div><div class="user">training.user@afterpay...</div><div class="nav">${nav.map(n=>`<button class="${active===n?'active':''}" onclick="${n==='Home'?"goSearch()":""}">${n}</button>`).join("")}</div></div>`}
function tabs(active,cid){const t=["General","Orders","Linked Businesses","Payments","Payment Decline","In-store Attempts","Refunds","Chargebacks","Identity","Fraud","Credit Enquiry","Related Accounts","Hardship","Devices","NPUF","Promotion","Afterpay Cards","Plus Card Subscription","Plus Card Subscription V3","Pay Monthly","Customer Comms","Statements"];return `<div class="tabbar">${t.map(x=>`<button class="tab ${active===x?'active':''}" onclick="${['General','Orders','Payments','Pay Monthly'].includes(x)?`openCustomer('${cid}','${x}')`:''}">${x}</button>`).join("")}</div>`}
function crumb(items){return `<div class="crumb"><a onclick="goSearch()">Home</a>${items.map(i=>` <span>&gt;</span> <a ${i.onclick||""}>${i.label}</a>`).join("")}</div>`}
window.goSearch=()=>{state={type:"search",results:[]};render()}
window.doSearch=()=>{let s=el("q").value.trim().toLowerCase();state.results=customers.filter(c=>!s||`${c.firstName} ${c.lastName} ${c.email} ${c.mobile}`.toLowerCase().includes(s));render()}
window.resetSearch=()=>{state.results=[];render()}
window.openCustomer=(id,tab="General")=>{state={type:"customer",customerId:id,tab};render()}
window.openOrder=(no)=>{state={type:"order",orderNo:no};render()}
function challenge(){return `<div class="challenge-banner"><div class="challenge-left"><h2>Practice task</h2><p>Search for <b>Oliver Reed</b>. Find:</p><ol><li>Pay Monthly Spend Limit</li><li>How many Pay Monthly orders he has</li><li>For Order <b>125459406</b>: loan term, interest rate, and payment status</li></ol></div><div class="challenge-right"><div class="answer"><b>Expected:</b> $10,000.00, 3 orders, 24 months, 0%, owed/awaiting payment.</div></div></div>`}
function searchPage(){return `${header("Home")}${challenge()}<main>${crumb([{label:"Consumers"}])}<section class="searchHero"><h1>Consumers <button class="pill small">Compare Accounts</button></h1><div class="filters"><input placeholder="ID, UUID, or Customer Token"><input id="q" placeholder="First Name, email, mobile or full name"><input placeholder="Last Name"><select><option>AU (+61)</option></select><input id="q2" placeholder="Email or Mobile" oninput="document.getElementById('q').value=this.value"><select><option>Status</option></select><select><option>Collections</option></select><select><option>Account Type</option></select></div><div class="actions"><button class="iconBtn" onclick="doSearch()">&#128269;</button><button class="iconBtn" onclick="resetSearch()">&#10005;</button></div></section><table><thead><tr><th>Customer Token</th><th>ID</th><th>UUID</th><th>First Name</th><th>Last Name</th><th>Date of Birth</th><th>Mobile</th><th>Email</th><th>Acc. Type</th><th>Status</th></tr></thead><tbody>${state.results.map(c=>`<tr onclick="openCustomer('${c.id}')"><td>${c.token}</td><td>${c.id}</td><td>${c.uuid}</td><td>${c.firstName}</td><td>${c.lastName}</td><td>${c.dob}</td><td>${c.mobile}</td><td>${c.email}</td><td>${c.accountType}</td><td>${c.status}</td></tr>`).join("")}</tbody></table><div class="hint">Try searching: Oliver, Grace, 0455, mia.nguyen@example.com</div></main>`}
function customerPage(){let c=customers.find(x=>x.id===state.customerId), active=state.tab||"General", os=c.orders.map(no=>orders[no]);let body="";if(active==="General")body=general(c);if(active==="Pay Monthly")body=payMonthly(c);if(active==="Orders")body=ordersTab(c,os);if(active==="Payments")body=paymentsTab(c,os);return `${header("Home")}${challenge()}<main>${crumb([{label:"Consumers"},{label:`${c.firstName} ${c.lastName}`},{label:active}])}${tabs(active,c.id)}${body}</main>`}
function kv(arr,large=""){return arr.map(([k,v,cls])=>`<p class="kv ${large}"><b>${k}</b><span class="${cls||""}">${v}</span></p>`).join("")}
function general(c){return `<section class="detail"><h1>${c.firstName} ${c.lastName}</h1><div class="cols"><div><h2>Personal Information</h2>${kv([["Name",`${c.firstName} ${c.lastName}`],["Consumer ID",c.id],["Consumer Account ID",c.accountId],["UUID",c.uuid],["Customer Token",c.token],["Account Type",c.accountType],["Email",c.email],["Mobile",c.mobile],["Date of Birth",c.dob],["Address",c.address],["Status",c.status]])}</div><div><h2>Financial</h2>${kv([["Available to spend",fmt(c.availableToSpend)],["Spend cap","Off"],["Payments paid late",c.paymentsPaidLate],["Amount Outstanding",fmt(Math.min(c.amountOutstanding,20000))],["Collections",c.collections],["Account Limit",fmt(c.payIn4Limit)]])}</div><div><h2>Order Summary</h2>${kv([["Total Pay Monthly Orders",c.orders.length],["Approved Orders",c.orders.length],["Declined Orders",0],["Failed Orders",0]])}<div class="amountDue"><div>AMOUNT DUE</div><strong>${fmt(Math.min(c.amountOutstanding,20000)).replace(" AUD","")}<br>AUD</strong></div></div></div></section>`}
function payMonthly(c){return `<section class="detail narrow"><h1>Credit Facility</h1>${kv([["Pay Monthly Limit",fmt(c.pmLimit).replace(" AUD","")],["Pay Monthly Creation Date",c.pmCreated],["Pay Monthly Status",c.pmStatus],["Pay Monthly Contract","View","link"]],"large")}</section>`}
function ordersTab(c,os){return `<section class="detail"><h1>${c.firstName} ${c.lastName} Orders</h1><div class="orderFilters"><button class="field">&#128197; From</button><button class="field">&#128197; To</button><input placeholder="MER Order"><input placeholder="Order No."><input placeholder="Email"><select><option>Status</option></select><select><option>Type</option></select><button class="circle">&#128269;</button><button class="circle">&#10005;</button><button class="circle">&#8681;</button></div><table><thead><tr><th>Date/Time &#9660;</th><th>MER Order No.</th><th>Order No.</th><th>Order Type</th><th>Merchant</th><th>Name</th><th>Email</th><th>Amount</th><th>Status</th><th>Channel</th></tr></thead><tbody>${os.map(o=>`<tr><td>${o.date}</td><td>W1772054${o.orderNo.slice(-5)}</td><td><a onclick="openOrder('${o.orderNo}')">${o.orderNo}</a></td><td>Monthly Payments</td><td>Apple Retail Testing</td><td>${c.firstName} ${c.lastName}</td><td>${c.email}</td><td>${fmt(o.amount)}</td><td>${o.status}</td><td>Online</td></tr>`).join("")}</tbody></table></section>`}
function paymentsTab(c,os){let payments=os.flatMap(o=>o.schedule).sort((a,b)=>a.date.localeCompare(b.date));return `<section class="detail"><h1>${c.firstName} ${c.lastName} Payments</h1><table><thead><tr><th>ID</th><th>Date Due &#9660;</th><th>Date Paid</th><th>Order</th><th>Bundled ID</th><th>Merchant</th><th>Amount</th><th>Status</th><th>Payment Method</th><th>Late Payment Exception</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${p.id}</td><td>${p.date}</td><td>${p.status==="PAID"?p.date:""}</td><td><a onclick="openOrder('${p.orderNo}')">${p.orderNo}</a></td><td></td><td><a>Apple Retail Testing</a></td><td>${fmt(p.amount)}</td><td>${p.status==="AWAITING PAYMENT"?"OWED":p.status}</td><td></td><td></td></tr>`).join("")}</tbody></table></section>`}
function orderPage(){let o=orders[state.orderNo],c=customers.find(x=>x.id===o.customerId),paid=o.paymentStatus==="PAID"?o.amount:0,owing=(o.paymentStatus==="REFUNDED"||o.paymentStatus==="PAID")?0:o.amount;return `${header("Orders")}${challenge()}<main>${crumb([{label:"Orders"},{label:o.orderNo}])}<div class="miniTabs"><button>General</button><button>Related (0)</button><button>Written Off (0)</button></div><section class="detail"><h1><span class="icon">&#127970;</span> Order <span>${o.orderNo}</span> <small>Merchant Order Number: W1772054${o.orderNo.slice(-5)} (${o.date}) Approved</small><button class="mintBtn">Create Dispute</button></h1><div class="cols"><div><h2>General</h2>${kv([["Amount",fmt(o.amount)],["Payment type","Monthly Payments"],["Receipt",o.receipt],["Risk score",0],["Order Status",o.status,"green"],["Settlement Status",o.settlement],["Channel","Online"],["Source",o.source],["Expiry Date","March 11, 2026 8:29AM"]])}</div><div><h2>Payment method</h2>${kv([["Payment Method","Card"],["Name",`${c.firstName} ${c.lastName}`],["Number","514813******3557 &#128308;&#128993;"],["Expiry","09/2029"],["Scheme","Debit"],["Status","Active"],["Bank","ME BANK"],["Country","AUSTRALIA"]])}</div><div><h2>Risk Signals</h2><a>View in Google maps</a><h2>Future payout calculator</h2><button class="field">Select payout date</button></div></div><div class="summaryGrid"><div class="panel"><h2>Consumer Order Summary</h2>${kv([["Order amount",fmt(o.amount)],["Amount financed",fmt(o.amount)],["Loan term",`${o.term} Months`],["Interest","$0.00 AUD (0%)"],["Interest cap","$0.00 AUD"],["Total paid interest","$0.00 AUD"],["Total paid principal",fmt(paid)],["Total cost",fmt(o.amount)],["Total paid",fmt(paid)],["Total owing",fmt(owing)]])}</div><div class="panel"><h2>Online Order Information</h2><p><b>Customer Details</b><br>${c.firstName} ${c.lastName}<br>${c.email}<br>${c.mobile}<br>Registered<br>Afterpay</p><p><b>Merchant Details</b><br>Apple Retail Testing<br>600123895<br>0394493332<br>Australia</p><h2>Delivery Summary</h2><p><b>Delivery Address</b><br>${c.address}<br>AU<br><a>View in Google maps</a></p></div></div><h2>Consumer Payment Schedule</h2><table><thead><tr><th>ID</th><th>Date</th><th>Due In</th><th>Amount</th><th>Status</th></tr></thead><tbody>${o.schedule.map(p=>`<tr><td>${p.id}</td><td>${p.date}</td><td><b>${p.dueIn}</b></td><td>${fmt(p.amount)} &#9679;</td><td>${p.status}</td></tr>`).join("")}</tbody></table><h2>Product Summary</h2><div class="product"><span>${o.product}<small>Quantity: 1</small></span><strong>${fmt(o.amount)}</strong></div></section></main>`}
function render(){document.getElementById("app").innerHTML=state.type==="search"?searchPage():state.type==="customer"?customerPage():orderPage()}
render();
</script>

</html>
